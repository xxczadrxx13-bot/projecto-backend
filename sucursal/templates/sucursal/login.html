{% extends 'sucursal/base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h4 class="card-title text-center mb-3 fw-bold">Acceso Administrativo</h4>
                {% if messages %}
                    {% for m in messages %}
                        <div class="alert alert-{{ m.tags }} py-2">{{ m }}</div>
                    {% endfor %}
                {% endif %}
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Usuario</label>
                        <input type="text" name="username" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">Ingresar al Sistema</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
