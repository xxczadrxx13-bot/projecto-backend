{% extends 'sucursal/base.html' %}
{% block content %}
<div class="row">
    <div class="col-md-4 mb-4">
        <div class="card card-custom p-4">
            <h4 class="fw-bold mb-3"><i class="bi bi-plus-circle text-danger"></i> Nuevo Producto</h4>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-2">
                    <label class="form-label small">Nombre</label>
                    <input type="text" name="nombre" class="form-control bg-dark text-light border-secondary" required>
                </div>
                <div class="mb-2">
                    <label class="form-label small">Código SKU</label>
                    <input type="text" name="codigo" class="form-control bg-dark text-light border-secondary" required>
                </div>
                <div class="mb-2">
                    <label class="form-label small">Categoría</label>
                    <select name="categoria" class="form-select bg-dark text-light border-secondary" required>
                        <option value="Instrumentos">Instrumentos</option>
                        <option value="Audio y Sonido">Audio y Sonido</option>
                        <option value="Accesorios">Accesorios</option>
                    </select>
                </div>
                <div class="row g-2 mb-2">
                    <div class="col-6">
                        <label class="form-label small">Precio</label>
                        <input type="number" name="precio" min="0" class="form-control bg-dark text-light border-secondary" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label small">Stock</label>
                        <input type="number" name="stock" min="0" class="form-control bg-dark text-light border-secondary" required>
                    </div>
                </div>
                <div class="mb-2">
                    <label class="form-label small">URL Imagen</label>
                    <input type="url" name="imagen" class="form-control bg-dark text-light border-secondary">
                </div>
                <div class="mb-3">
                    <label class="form-label small">Descripción</label>
                    <textarea name="descripcion" class="form-control bg-dark text-light border-secondary" rows="2"></textarea>
                </div>
                <button type="submit" class="btn btn-brand w-100">Guardar Producto</button>
            </form>
        </div>
    </div>
    <div class="col-md-8">
        <div class="card card-custom p-4">
            <h4 class="fw-bold mb-3">Catálogo en JSON</h4>
            <div class="table-responsive">
                <table class="table table-dark table-hover align-middle">
                    <thead>
                        <tr>
                            <th>SKU</th>
                            <th>Nombre</th>
                            <th>Categoría</th>
                            <th>Precio</th>
                            <th>Stock</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for p in productos %}
                        <tr>
                            <td><code>{{ p.codigo }}</code></td>
                            <td>{{ p.nombre }}</td>
                            <td>{{ p.categoria }}</td>
                            <td>${{ p.precio }}</td>
                            <td><span class="badge bg-success">{{ p.stock }}</span></td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
